
name: Publish Scribe dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: '5 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: scribe-pages
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - run: python -m pip install -r requirements.txt

      - run: python render.py --data demo.json --output site/dashboard.png

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site


      - name: Upload dashboard to private Cloudflare KV
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ vars.CF_KV_NAMESPACE_ID }}
        run: |
          curl --fail --silent --show-error \
            --retry 3 \
            --request PUT \
            --header "Authorization: Bearer $CF_API_TOKEN" \
            --header "Content-Type: application/octet-stream" \
            --data-binary @site/dashboard.png \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/storage/kv/namespaces/$CF_KV_NAMESPACE_ID/values/dashboard.png" \
          | python -c 'import json,sys; assert json.load(sys.stdin)["success"]'


      - id: deployment
        uses: actions/deploy-pages@v5
