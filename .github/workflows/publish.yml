
name: Publish Scribe dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: '5 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: scribe-pages
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - run: python -m pip install -r requirements.txt

      - run: python render.py --data demo.json --output site/dashboard.png

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5
