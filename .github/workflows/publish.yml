
name: Publish Scribe dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: '55 * * * *'

permissions:
  contents: read

concurrency:
  group: scribe-kv
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 8

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Cache Japanese font
        id: japanese-font
        uses: actions/cache@v4
        with:
          path: ~/.cache/scribe-fonts/NotoSansCJK-Regular.ttc
          key: noto-cjk-ubuntu-24.04-v1

      - name: Install Japanese font
        if: steps.japanese-font.outputs.cache-hit != 'true'
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 install -y fonts-noto-cjk
          mkdir -p ~/.cache/scribe-fonts
          cp /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc ~/.cache/scribe-fonts/

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch live widgets using private previous image as fallback
        env:
          DASHBOARD_IMAGE_URL: ${{ secrets.DASHBOARD_IMAGE_URL }}
          DASHBOARD_READ_TOKEN: ${{ secrets.DASHBOARD_READ_TOKEN }}
          WEATHER_LATITUDE: ${{ secrets.WEATHER_LATITUDE }}
          WEATHER_LONGITUDE: ${{ secrets.WEATHER_LONGITUDE }}
          GOOGLE_CALENDAR_CREDENTIALS: ${{ secrets.GOOGLE_CALENDAR_CREDENTIALS }}
          GOOGLE_CALENDAR_IDS: ${{ secrets.GOOGLE_CALENDAR_IDS }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
        run: python live_widgets.py

      - name: Render dashboard
        run: python render.py --data /tmp/scribe-live-data.json --state /tmp/scribe-widget-state.json --output site/dashboard.png

      - name: Upload dashboard to private Cloudflare KV
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ vars.CF_KV_NAMESPACE_ID }}
        run: |
          set -euo pipefail

          : "${CF_API_TOKEN:?Missing CF_API_TOKEN}"
          : "${CF_ACCOUNT_ID:?Missing CF_ACCOUNT_ID}"
          : "${CF_KV_NAMESPACE_ID:?Missing CF_KV_NAMESPACE_ID}"

          response="$(curl --fail --silent --show-error \
            --retry 3 \
            --request PUT \
            --header "Authorization: Bearer $CF_API_TOKEN" \
            --header "Content-Type: application/octet-stream" \
            --data-binary @site/dashboard.png \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/storage/kv/namespaces/$CF_KV_NAMESPACE_ID/values/dashboard.png")"

          printf '%s' "$response" | python -c \
            'import json,sys; r=json.load(sys.stdin); assert r.get("success"), r.get("errors"); print("KV upload succeeded")'
